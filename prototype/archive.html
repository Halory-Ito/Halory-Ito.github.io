<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VNBlog | ARCHIVE</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.13/dist/index.global.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap');
    body { font-family: 'Cormorant Garamond', 'FangSong', '仿宋', serif; color: #f8f7ff; background-image: url('../public/images/cg/ev4005.png'); background-size: cover; background-position: center; background-attachment: fixed; min-height: 100dvh; line-height: 1.9; }
    body::before { content: ''; position: fixed; inset: 0; background-color: rgba(21, 18, 45, 0.6); pointer-events: none; z-index: 0; }
    header, main, footer { position: relative; z-index: 1; }
    header::after { content: ''; position: absolute; inset: auto 0 0 0; height: 1px; background-color: rgba(226, 222, 255, 0.3); }

    /* ===== 时间轴 ===== */
    .timeline { position: relative; max-width: 56rem; }
    .timeline::before { content: ''; position: absolute; left: 8px; top: 0.6rem; bottom: 0.6rem; width: 1px; background-color: rgba(226, 222, 255, 0.25); }
    .tl-item { position: relative; display: grid; grid-template-columns: minmax(110px, auto) minmax(0, 1fr) auto; gap: 1.1rem; align-items: center; padding: 0.55rem 0.9rem 0.55rem 1.9rem; border-radius: 10px; transition: all 180ms ease; }
    .tl-item::before { content: ''; position: absolute; left: 3.5px; top: 50%; transform: translateY(-50%); width: 9px; height: 9px; border-radius: 999px; border: 1px solid rgba(226, 222, 255, 0.75); background-color: #15122d; transition: background-color 180ms ease; }
    .tl-item:hover { background-color: rgba(196, 190, 255, 0.1); }
    .tl-item:hover::before { background-color: rgba(226, 222, 255, 0.9); }
    .tl-date { font-size: 0.8rem; letter-spacing: 0.25em; color: rgba(248, 247, 255, 0.5); white-space: nowrap; }
    .tl-main { display: flex; flex-direction: column; gap: 0.05rem; min-width: 0; }
    .tl-title { font-size: 1.05rem; letter-spacing: 0.25em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tl-tags { font-size: 0.68rem; letter-spacing: 0.35em; text-transform: uppercase; color: rgba(248, 247, 255, 0.45); }
    .tl-arrow { font-size: 0.85rem; color: rgba(248, 247, 255, 0.35); transition: color 180ms ease; }
    .tl-item:hover .tl-arrow { color: rgba(248, 247, 255, 0.85); }
  </style>
</head>
<body>
  <header class="relative">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-6 px-6 py-8">
      <p class="text-xs uppercase tracking-[0.8em] text-white/50">ARCHIVE</p>
      <nav class="flex items-center gap-6 text-xs uppercase tracking-[0.4em] text-white/60">
        <a class="transition hover:text-white" href="index.html">TITLE</a>
        <a class="transition hover:text-white" href="article.html">ARTICLE</a>
        <a class="transition hover:text-white" href="extra.html">EXTRA</a>
        <a class="transition hover:text-white" href="settings.html">SETTINGS</a>
        <a class="transition hover:text-white" href="about.html">ABOUT</a>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-6 pb-20">
    <div class="timeline mt-6">
      <a class="tl-item" href="scene.html">
        <span class="tl-date">2026-10-29</span>
        <span class="tl-main">
          <span class="tl-title">入夜的车站</span>
          <span class="tl-tags">SCENE · RAIN</span>
        </span>
        <span class="tl-arrow">→</span>
      </a>
      <a class="tl-item" href="scene.html">
        <span class="tl-date">2026-10-28</span>
        <span class="tl-main">
          <span class="tl-title">便利店的荧光</span>
          <span class="tl-tags">ESSAY · NIGHT</span>
        </span>
        <span class="tl-arrow">→</span>
      </a>
      <a class="tl-item" href="scene.html">
        <span class="tl-date">2026-10-27</span>
        <span class="tl-main">
          <span class="tl-title">下班路线</span>
          <span class="tl-tags">NOTE · ROUTE</span>
        </span>
        <span class="tl-arrow">→</span>
      </a>
    </div>
  </main>
  <footer class="border-t border-white/10 py-8 text-center text-xs uppercase tracking-[0.4em] text-white/40">VNBlog Prototype · Archive</footer>
</body>
</html>
