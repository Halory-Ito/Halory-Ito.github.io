<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VNBlog | SETTINGS</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.13/dist/index.global.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap');
    body { font-family: 'Cormorant Garamond', 'FangSong', '仿宋', serif; color: #f8f7ff; overflow: hidden; }
    .bg-layer::after { content: ''; position: absolute; inset: 0; background-color: rgba(9, 7, 24, 0.45); }
    .panel { position: relative; width: min(880px, calc(100vw - 2rem)); border-radius: 18px; background-color: rgba(24, 20, 60, 0.4); border: 1px solid rgba(226, 222, 255, 0.25); box-shadow: 0 40px 80px -60px rgba(24, 20, 60, 0.9); overflow: hidden; }
    .panel::before { content: ''; position: absolute; inset: 0; background-color: rgba(226, 222, 255, 0.04); pointer-events: none; }
    .panel-inner { position: relative; display: flex; flex-direction: column; gap: 1.6rem; padding: clamp(2rem, 6vw, 4.6rem); }
    .divider { height: 1px; background-color: rgba(226, 222, 255, 0.32); }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 1rem; align-items: center; }
    .toggle { width: 52px; height: 28px; border-radius: 999px; border: 1px solid rgba(226, 222, 255, 0.5); position: relative; background-color: rgba(226, 222, 255, 0.15); }
    .toggle::after { content: ''; position: absolute; top: 3px; left: 4px; width: 20px; height: 20px; border-radius: 50%; background-color: rgba(248, 247, 255, 0.9); transition: transform 160ms ease; }
    .toggle.on { background-color: rgba(196, 190, 255, 0.5); }
    .toggle.on::after { transform: translateX(22px); }
    .slider { width: 220px; height: 6px; border-radius: 999px; background-color: rgba(226, 222, 255, 0.25); position: relative; }
    .slider::after { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 60%; background-color: rgba(248, 247, 255, 0.9); border-radius: inherit; }
  </style>
</head>
<body class="relative h-screen w-screen" style="background-color: #15122d;">
  <div class="bg-layer absolute inset-0">
    <img src="../public/images/cg/ev5015.png" alt="黄昏场景" class="h-full w-full object-cover">
  </div>
  <div class="absolute inset-0" style="background-color: rgba(9, 7, 24, 0.2);"></div>

  <header class="absolute top-0 left-0 right-0 z-10 flex items-center justify-between px-6 py-8 sm:px-10">
    <div class="text-xs uppercase tracking-[0.6em] text-white/50">SETTINGS</div>
    <nav class="flex items-center gap-6 text-xs uppercase tracking-[0.4em] text-white/60">
      <a class="transition hover:text-white" href="index.html">TITLE</a>
      <a class="transition hover:text-white" href="archive.html">ARCHIVE</a>
      <a class="transition hover:text-white" href="extra.html">EXTRA</a>
      <a class="transition hover:text-white" href="about.html">ABOUT</a>
    </nav>
  </header>

  <main class="relative z-10 flex h-full items-center justify-center px-4">
    <article class="panel">
      <div class="panel-inner">
        <div>
          <p class="text-xs uppercase tracking-[0.8em] text-white/50">SYSTEM CONFIG</p>
          <h1 class="mt-4 text-4xl sm:text-5xl tracking-[0.5em] uppercase">设置</h1>
        </div>
        <div class="divider"></div>
        <div class="flex flex-col gap-6 text-lg tracking-[0.08em] text-white/85">
          <div class="row">
            <div>
              <div class="text-xl">文字速度</div>
              <div class="text-sm text-white/50 mt-1">打字机逐字显示的速度</div>
            </div>
            <div class="flex items-center gap-4">
              <span class="text-sm text-white/50">慢</span>
              <div class="slider"></div>
              <span class="text-sm text-white/50">快</span>
            </div>
          </div>
          <div class="row">
            <div>
              <div class="text-xl">自动播放</div>
              <div class="text-sm text-white/50 mt-1">阅读完一段后自动进入下一段</div>
            </div>
            <div class="toggle"></div>
          </div>
          <div class="row">
            <div>
              <div class="text-xl">跳过已读</div>
              <div class="text-sm text-white/50 mt-1">自动跳过曾经读过的段落</div>
            </div>
            <div class="toggle on"></div>
          </div>
          <div class="row">
            <div>
              <div class="text-xl">背景音乐</div>
              <div class="text-sm text-white/50 mt-1">启用场景 BGM</div>
            </div>
            <div class="toggle on"></div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="flex flex-wrap items-center justify-between gap-6 text-xs uppercase tracking-[0.4em] text-white/50">
          <span>VNBlog Settings · Prototype</span>
          <a class="transition hover:text-white" href="index.html">BACK TO TITLE →</a>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
