<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VNBlog | 标题界面</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.13/dist/index.global.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap');

    :root {
      --ui-text: #f5f3ff;
    }

    body {
      font-family: 'Cormorant Garamond', 'FangSong', '仿宋', serif;
      color: var(--ui-text);
      text-shadow: 0 2px 12px rgba(15, 12, 36, 0.8);
      overflow: hidden;
      background-color: #15122d;
    }

    .bg-layer::after {
      content: '';
      position: absolute;
      inset: 0;
      background-color: rgba(9, 7, 24, 0.4);
    }

    .menu-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.4rem 0.6rem;
      letter-spacing: 0.6em;
      text-transform: uppercase;
      transition: all 180ms ease;
    }

    .menu-btn::before,
    .menu-btn::after {
      content: '';
      height: 1px;
      flex: 1;
      background-color: rgba(245, 243, 255, 0.6);
      opacity: 0;
      transform: scaleX(0.4);
      transition: all 220ms ease;
    }

    .menu-btn:hover {
      letter-spacing: 0.8em;
      color: #fff;
    }

    .menu-btn:hover::before,
    .menu-btn:hover::after {
      opacity: 1;
      transform: scaleX(1);
    }

    .fade-in {
      animation: fade-in 900ms ease forwards;
      opacity: 0;
    }

    .fade-in-delay {
      animation: fade-in 900ms ease 280ms forwards;
      opacity: 0;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body class="relative h-screen w-screen">
  <div class="bg-layer absolute inset-0">
    <img src="../public/images/title-background/renewal-cg.webp" alt="标题背景" class="h-full w-full object-cover">
  </div>
  <div class="absolute inset-0" style="background-color: rgba(9, 7, 24, 0.3);"></div>

  <main class="relative z-10 flex h-full flex-col items-center justify-center text-center">
    <div class="fade-in">
      <!-- <p class="mb-4 text-xs uppercase tracking-[1.2em] text-white/60">VISUAL NOVEL STYLE BLOG</p> -->
      <h1 class="text-6xl sm:text-7xl lg:text-8xl tracking-[0.8em] uppercase">VNBLOG</h1>
      <p class="mt-6 text-sm tracking-[0.6em] uppercase text-white/70">一行文字，一幕场景</p>
    </div>
    <nav class="fade-in-delay mt-16 flex flex-col items-center gap-6 text-sm">
      <a class="menu-btn" href="scene.html"><span>START</span></a>
      <a class="menu-btn" href="archive.html"><span>ARCHIVE</span></a>
      <a class="menu-btn" href="extra.html"><span>EXTRA</span></a>
      <a class="menu-btn" href="settings.html"><span>SETTINGS</span></a>
      <a class="menu-btn" href="about.html"><span>ABOUT</span></a>
    </nav>
  </main>

  <footer
    class="absolute bottom-6 left-1/2 -translate-x-1/2 text-center text-xs tracking-[0.35em] uppercase text-white/40">
    <span>© 2026 VNBlog · Powered by Astro & React</span>
    <span class="mx-2 text-white/20">|</span>
    <a class="transition hover:text-white/70" href="https://beian.miit.gov.cn">京ICP备20260101号-1</a>
  </footer>
</body>

</html>
